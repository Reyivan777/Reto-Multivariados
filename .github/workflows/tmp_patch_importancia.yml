name: Ajustar importancia por horizonte

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/tmp_patch_importancia.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste
        run: python scripts/tmp_patch_importancia.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compara importancia de variables entre horizontes"
          git push
