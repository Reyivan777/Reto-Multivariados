name: Agregar comparacion de horizontes XGBoost

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/tmp_horizontes_xgb.yml"

permissions:
  contents: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Agregar comparacion h 1 6 12 24
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          bloque = base64.b64decode('').decode('utf-8')
          path = Path('quarto/xgboost.qmd')
          texto = path.read_text(encoding='utf-8')
          marcador = '\n# Evaluación\n'
          if '#| label: comparacion-horizontes-xgboost' not in texto:
              if marcador not in texto:
                  raise RuntimeError('No se encontró la sección Evaluación en xgboost.qmd')
              texto = texto.replace(marcador, '\n' + bloque + '\n\n# Evaluación\n', 1)
              texto = texto.replace('Por ahora solo se evalúa el horizonte de una hora sobre **2024**. Después de comprobar el desempeño inicial y revisar la importancia de variables, el siguiente paso será extender el mismo procedimiento a horizontes representativos de 6, 12 y 24 horas antes de entrenar los 24 modelos.', 'La configuración inicial ya se evalúa sobre **2024** en horizontes de 1, 6, 12 y 24 horas. Estos resultados permitirán decidir el siguiente paso de ajuste sin utilizar todavía el conjunto de prueba final.')
              path.write_text(texto, encoding='utf-8')
          Path('.github/workflows/tmp_horizontes_xgb.yml').unlink()
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quarto/xgboost.qmd .github/workflows/tmp_horizontes_xgb.yml
          git commit -m "Compara XGBoost en horizontes representativos"
          git push
