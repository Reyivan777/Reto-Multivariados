name: Corregir fechas

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/fix_fechas.yml"

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corregir bloque de fechas
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("quarto/reporte.qmd")
          text = path.read_text(encoding="utf-8")

          old = '''datos_modelo <- datos_limpios |>
            mutate(
              `fecha y hora` = as.POSIXct(
                as.numeric(`fecha y hora`) * 86400,
                origin = "1899-12-30",
                tz = "UTC"
              ),
              Hora = lubridate::hour(`fecha y hora`),
              Dia = lubridate::day(`fecha y hora`),
              Mes = lubridate::month(`fecha y hora`),
              Dia_semana = lubridate::wday(`fecha y hora`, label = TRUE),
              Estacion = as.factor(Estacion),
              Dia_semana = as.factor(Dia_semana)
            )
          '''

          new = '''convertir_fecha_hora <- function(x) {
            x_chr <- as.character(x)
            x_num <- suppressWarnings(as.numeric(x_chr))

            fecha_excel <- as.POSIXct(
              x_num * 86400,
              origin = "1899-12-30",
              tz = "UTC"
            )

            fecha_texto <- suppressWarnings(
              lubridate::parse_date_time(
                x_chr,
                orders = c(
                  "Ymd HMS", "Ymd HM",
                  "dmY HMS", "dmY HM",
                  "mdY HMS", "mdY HM"
                ),
                tz = "UTC"
              )
            )

            dplyr::coalesce(fecha_excel, fecha_texto)
          }

          datos_modelo <- datos_limpios |>
            mutate(
              `fecha y hora` = convertir_fecha_hora(`fecha y hora`),
              Hora = lubridate::hour(`fecha y hora`),
              Dia = lubridate::day(`fecha y hora`),
              Mes = lubridate::month(`fecha y hora`),
              Dia_semana = lubridate::wday(`fecha y hora`, label = TRUE),
              Estacion = as.factor(Estacion),
              Dia_semana = as.factor(Dia_semana)
            )
          '''

          if old not in text:
              raise SystemExit("No se encontró el bloque esperado de fecha y hora")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Guardar corrección
        run: |
          rm .github/workflows/fix_fechas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quarto/reporte.qmd .github/workflows/fix_fechas.yml
          git commit -m "Corrige fechas"
          git push
