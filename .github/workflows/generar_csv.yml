name: Generar CSV limpio

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/generar_csv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::readxl
            any::dplyr
            any::tidyr
            any::purrr
            any::stringr
            any::readr
            any::tibble

      - name: Generar base limpia
        shell: Rscript {0}
        run: |
          library(readxl)
          library(dplyr)
          library(tidyr)
          library(purrr)
          library(stringr)
          library(readr)
          library(tibble)

          variables_numericas <- c(
            "CO", "NO", "NO2", "NOX", "O3", "PM10", "PM2.5",
            "BP", "RAINF", "RH", "SO2", "SR", "TEMP", "WS", "WD"
          )

          leer_base <- function(archivo, año) {
            hojas <- excel_sheets(archivo)

            map_dfr(hojas, function(hoja) {
              datos <- read_excel(archivo, sheet = hoja, col_types = "text")
              nombres <- names(datos)
              nombres <- nombres |>
                str_replace_all("[\\r\\n]", " ") |>
                str_replace("\\s*\\([^)]*\\).*", "") |>
                str_squish()

              nombres[tolower(nombres) == "fecha y hora"] <- "fecha y hora"
              nombres[tolower(nombres) == "date"] <- "fecha y hora"
              nombres[toupper(nombres) == "PRS"] <- "BP"
              nombres[toupper(nombres) == "TOUT"] <- "TEMP"
              nombres[toupper(nombres) == "WSR"] <- "WS"
              nombres[toupper(nombres) == "WDR"] <- "WD"
              nombres[toupper(nombres) == "CO"] <- "CO"
              nombres[toupper(nombres) == "NO"] <- "NO"
              nombres[toupper(nombres) == "NO2"] <- "NO2"
              nombres[toupper(nombres) == "NOX"] <- "NOX"
              nombres[toupper(nombres) == "O3"] <- "O3"
              nombres[toupper(nombres) == "PM10"] <- "PM10"
              nombres[toupper(nombres) == "PM2.5"] <- "PM2.5"
              nombres[toupper(nombres) == "RAINF"] <- "RAINF"
              nombres[toupper(nombres) == "RH"] <- "RH"
              nombres[toupper(nombres) == "SO2"] <- "SO2"
              nombres[toupper(nombres) == "SR"] <- "SR"
              names(datos) <- nombres

              datos |>
                mutate(
                  across(
                    any_of(variables_numericas),
                    ~ suppressWarnings(parse_number(as.character(.x)))
                  ),
                  Año = año,
                  Estacion = hoja
                )
            })
          }

          bases <- list(
            leer_base("data/BD 2020.xlsx", 2020),
            leer_base("data/BD 2021.xlsx", 2021),
            leer_base("data/BD 2022.xlsx", 2022),
            leer_base("data/BD 2023.xlsx", 2023),
            leer_base("data/BD 2024.xlsx", 2024),
            leer_base("data/BD 2025.xlsx", 2025)
          )

          datos_limpios <- bind_rows(bases) |>
            mutate(across(any_of(variables_numericas), ~ na_if(.x, -9999)))

          limites <- tribble(
            ~Año, ~Variable, ~Min, ~Max,
            2020, "PM10", 0, 800, 2020, "PM2.5", 0, 205.94, 2020, "O3", 0, 153,
            2020, "NO", 0, 500, 2020, "NO2", 0, 200, 2020, "NOX", 0, 500,
            2020, "SO2", 0, 200, 2020, "CO", 0, 20, 2020, "RH", 0, 100,
            2020, "WS", 0, 75, 2020, "TEMP", 0, 41, 2020, "SR", 0, 1,
            2020, "BP", 690, 750, 2020, "WD", 0, 360, 2020, "RAINF", 0, 30,
            2021, "PM10", 0, 800, 2021, "PM2.5", 0, 325, 2021, "O3", 0, 175,
            2021, "NO", 0, 350, 2021, "NO2", 0, 100, 2021, "NOX", 0, 400,
            2021, "SO2", 0, 300, 2021, "CO", 0, 10, 2021, "RH", 0, 100,
            2021, "WS", 0, 40, 2021, "TEMP", -6.5, 45, 2021, "SR", 0, 1,
            2021, "BP", 690, 740, 2021, "WD", 0, 360, 2021, "RAINF", 0, 80,
            2022, "PM10", 0, 999, 2022, "PM2.5", 0, 450, 2022, "O3", 0, 160,
            2022, "NO", 0, 400, 2022, "NO2", 0, 175, 2022, "NOX", 0, 420,
            2022, "SO2", 0, 200, 2022, "CO", 0, 8, 2022, "RH", 0, 100,
            2022, "WS", 0, 35, 2022, "TEMP", -5, 45, 2022, "SR", 0, 1.25,
            2022, "BP", 700, 740, 2022, "WD", 0, 360, 2022, "RAINF", 0, 25,
            2023, "PM10", 0, 900, 2023, "PM2.5", 0, 800, 2023, "O3", 0, 175,
            2023, "NO", 0, 500, 2023, "NO2", 0, 175, 2023, "NOX", 0, 500,
            2023, "SO2", 0, 250, 2023, "CO", 0, 14, 2023, "RH", 0, 100,
            2023, "WS", 0, 40, 2023, "TEMP", 0, 45, 2023, "SR", 0, 1,
            2023, "BP", 690, 740, 2023, "WD", 0, 360, 2023, "RAINF", 0, 70,
            2024, "PM10", 0, 999, 2024, "PM2.5", 0, 999, 2024, "O3", 0, 180,
            2024, "NO", 0, 400, 2024, "NO2", 0, 130, 2024, "NOX", 0, 500,
            2024, "SO2", 0, 150, 2024, "CO", 0, 18, 2024, "RH", 0, 100,
            2024, "WS", 0, 38, 2024, "TEMP", -4, 45.5, 2024, "SR", 0, 1.26,
            2024, "BP", 687.5, 740, 2024, "WD", 0, 360, 2024, "RAINF", 0, 50,
            2025, "PM10", 0, 820, 2025, "PM2.5", 0, 350, 2025, "O3", 0, 185,
            2025, "NO", 0, 350, 2025, "NO2", 0, 175, 2025, "NOX", 0, 400,
            2025, "SO2", 0, 405, 2025, "CO", 0, 10, 2025, "RH", 0, 100,
            2025, "WS", 0, 40, 2025, "TEMP", -4.5, 45, 2025, "SR", 0, 1.2,
            2025, "BP", 688, 740, 2025, "WD", 0, 360, 2025, "RAINF", 0, 25
          )

          for (i in seq_len(nrow(limites))) {
            año_i <- limites$Año[i]
            variable_i <- limites$Variable[i]
            min_i <- limites$Min[i]
            max_i <- limites$Max[i]

            fuera_rango <-
              datos_limpios$Año == año_i &
              !is.na(datos_limpios[[variable_i]]) &
              (datos_limpios[[variable_i]] < min_i |
                 datos_limpios[[variable_i]] > max_i)

            datos_limpios[[variable_i]][fuera_rango] <- NA_real_
          }

          datos_etapa2 <- datos_limpios |>
            filter(Estacion %in% c("NTE", "NTE2", "NO", "NE"))

          write_csv(datos_etapa2, "data/datos_etapa2_limpios.csv")

          stopifnot(nrow(datos_etapa2) == 192723)
          stopifnot(all(sort(unique(datos_etapa2$Estacion)) == sort(c("NTE", "NTE2", "NO", "NE"))))

      - name: Subir CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/datos_etapa2_limpios.csv
          if ! git diff --cached --quiet; then
            git commit -m "Agrega CSV"
            git push
          fi
