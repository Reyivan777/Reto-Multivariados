name: Interpretar resultados de 24 horizontes

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/tmp_interpretar_24_horizontes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Agregar interpretación
        run: python scripts/tmp_interpretar_24_horizontes.py

      - name: Guardar cambios
        run: |
          rm scripts/tmp_interpretar_24_horizontes.py
          rm .github/workflows/tmp_interpretar_24_horizontes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Interpreta resultados de los 24 horizontes"
          git push
