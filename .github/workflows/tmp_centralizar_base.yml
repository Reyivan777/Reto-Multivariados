name: Centralizar base de modelado

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/tmp_centralizar_base.yml"

permissions:
  contents: write

jobs:
  centralizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar reorganización
        run: python scripts/tmp_centralizar_base.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centraliza la base de modelado para XGBoost"
          git push
