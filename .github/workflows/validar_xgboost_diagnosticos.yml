name: Validar diagnosticos XGBoost

on:
  push:
    branches:
      - trunk
    paths:
      - ".github/workflows/validar_xgboost_diagnosticos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - name: Restaurar paquetes
        uses: r-lib/actions/setup-renv@v2

      - name: Aplicar cambios y preparar validacion
        run: python3 scripts/patch_xgboost_diagnostics.py

      - name: Generar base de modelado
        run: |
          Rscript /tmp/reporte_base.R
          test -f data/base_modelado_o3.rds

      - name: Ejecutar XGBoost con diagnosticos
        run: Rscript /tmp/xgboost_diagnosticos.R

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quarto/xgboost.qmd
          git rm scripts/patch_xgboost_diagnostics.py
          git rm .github/workflows/validar_xgboost_diagnosticos.yml
          git commit -m "Agrega residuos y Gain por estacion a XGBoost"
          git push
