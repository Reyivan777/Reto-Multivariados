name: Reentrenar XGBoost vectorial

on:
  push:
    branches:
      - trunk
    paths:
      - ".github/workflows/reentrenar_xgboost_vector.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reentrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - name: Restaurar paquetes
        uses: r-lib/actions/setup-renv@v2

      - name: Preparar scripts y modificar xgboost.qmd
        run: python3 scripts/retrain_xgb_vector.py

      - name: Generar base de modelado
        run: Rscript /tmp/reporte_base.R

      - name: Reentrenar y evaluar XGBoost
        run: |
          Rscript /tmp/xgboost_vector.R
          cat /tmp/xgb_resultados.env

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RESULTADOS="$(cat /tmp/xgb_resultados.env)"
          git add quarto/xgboost.qmd
          git rm scripts/retrain_xgb_vector.py
          git rm .github/workflows/reentrenar_xgboost_vector.yml
          git commit -m "Reformula viento en XGBoost con dos componentes" -m "$RESULTADOS"
          git push
