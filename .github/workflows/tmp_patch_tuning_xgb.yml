name: Aplicar tuning reducido XGBoost

on:
  push:
    branches: [trunk]
    paths:
      - ".github/workflows/tmp_patch_tuning_xgb.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cambios
        run: python scripts/tmp_patch_tuning_xgb.py

      - name: Guardar cambios
        run: |
          rm scripts/tmp_patch_tuning_xgb.py
          rm .github/workflows/tmp_patch_tuning_xgb.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agrega tuning reducido de XGBoost"
          git push
