name: Aplicar interpretaciones XGBoost

on:
  push:
    branches:
      - trunk
    paths:
      - ".github/workflows/aplicar_interpretaciones_xgboost.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Incorporar interpretaciones
        run: python3 scripts/patch_xgboost_interpretaciones.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quarto/xgboost.qmd
          git rm scripts/patch_xgboost_interpretaciones.py
          git rm .github/workflows/aplicar_interpretaciones_xgboost.yml
          git commit -m "Interpreta Gain por estacion y residuos del XGBoost"
          git push
