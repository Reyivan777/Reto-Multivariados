name: Render PDF

on:
  push:
    branches: [trunk]
    paths:
      - "quarto/reporte.qmd"
      - ".github/workflows/render_pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - uses: r-lib/actions/setup-r@v2

      - name: Instalar paquetes de R
        shell: Rscript {0}
        run: |
          install.packages(c(
            "tidyverse", "here", "readxl", "maps", "stringr",
            "readr", "purrr", "lubridate", "knitr"
          ), repos = "https://cloud.r-project.org")

      - name: Renderizar PDF
        run: quarto render quarto/reporte.qmd --to pdf

      - name: Revisar páginas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdfinfo quarto/reporte.pdf | grep '^Pages:'

      - name: Guardar PDF
        run: |
          mkdir -p docs
          cp quarto/reporte.pdf docs/reporte.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reporte.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza PDF"
            git push
          fi
