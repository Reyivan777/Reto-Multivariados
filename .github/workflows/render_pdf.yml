name: Render PDF

on:
  push:
    branches: [trunk]
    paths:
      - "quarto/reporte.qmd"
      - ".github/workflows/render_pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - uses: r-lib/actions/setup-r@v2

      - name: Instalar paquetes de R
        shell: Rscript {0}
        run: |
          install.packages(c(
            "tidyverse", "here", "readxl", "maps", "stringr",
            "readr", "purrr", "lubridate", "knitr"
          ), repos = "https://cloud.r-project.org")

      - name: Normalizar fecha para render
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("quarto/reporte.qmd")
          text = path.read_text(encoding="utf-8")
          old = '''    datos |>
              mutate(
                across(any_of(c(
          '''
          new = '''    datos |>
              mutate(
                `fecha y hora` = as.character(`fecha y hora`),
                across(any_of(c(
          '''

          if old not in text:
              raise SystemExit("No se encontró el bloque esperado de leer_base().")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Renderizar PDF
        run: quarto render quarto/reporte.qmd --to pdf

      - name: Revisar páginas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdfinfo quarto/reporte.pdf | grep '^Pages:'

      - name: Guardar PDF
        run: |
          mkdir -p docs
          cp quarto/reporte.pdf docs/reporte.pdf
          git restore quarto/reporte.qmd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reporte.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza PDF"
            git push
          fi
