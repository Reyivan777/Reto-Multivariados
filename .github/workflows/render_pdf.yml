name: Render PDF

on:
  push:
    branches: [trunk]
    paths:
      - "quarto/reporte.qmd"
      - "quarto/entrega_etapa_2.qmd"
      - "data/datos_etapa2_limpios.csv"
      - "renv.lock"
      - ".Rprofile"
      - "renv/**"
      - ".github/workflows/render_pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - name: Restaurar environment
        uses: r-lib/actions/setup-renv@v2

      - name: Activar renv
        run: |
          LIB_PATH=$(Rscript --vanilla -e 'invisible(capture.output(source("renv/activate.R"))); cat(.libPaths()[1])' 2>/dev/null)
          echo "R_LIBS_USER=$LIB_PATH" >> "$GITHUB_ENV"

      - name: Instalar maps
        run: Rscript -e 'install.packages("maps", repos = "https://cloud.r-project.org")'

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Renderizar PDFs
        run: |
          quarto render quarto/reporte.qmd --to pdf
          quarto render quarto/entrega_etapa_2.qmd --to pdf
          test -s docs/quarto/reporte.pdf
          test -s docs/quarto/entrega_etapa_2.pdf
          echo "PDFs generados correctamente"

      - name: Revisar páginas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          echo "Reporte completo:"
          pdfinfo docs/quarto/reporte.pdf | grep '^Pages:'
          echo "Entrega Etapa 2:"
          pdfinfo docs/quarto/entrega_etapa_2.pdf | grep '^Pages:'

      - name: Guardar PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quarto/reporte.pdf docs/quarto/entrega_etapa_2.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza PDFs"
            git push
          fi

# El render utiliza el environment reproducible definido por renv.lock.
